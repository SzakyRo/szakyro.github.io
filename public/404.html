<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Not found — Liviu Gelca</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0B0F12;
        color: #D6DEE5;
        margin: 0;
        padding: 4rem 1.5rem;
        line-height: 1.5;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
      }
      /* The 404 line is the page's h1; reset it to render exactly like
         the <p> it replaces so the visual output is unchanged. */
      h1 {
        font-size: inherit;
        font-weight: inherit;
        margin: 1em 0;
      }
      a {
        color: #82AAFF;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .prompt {
        color: #7FD962;
      }
    </style>
  </head>
  <body>
    <main>
      <p><span class="prompt">$</span> cd / && ls -la</p>
      <h1>404 — that path doesn't exist on this site.</h1>
      <p>↳ <a href="/">back to the cv</a></p>
    </main>
  </body>
</html>
